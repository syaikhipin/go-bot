name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Go, Web, mobile and Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Check Go formatting
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test Go packages
        run: make test vet check
      - name: Check for data races
        if: github.event_name == 'workflow_dispatch'
        run: make race

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - name: Build and test Web
        run: |
          make build-web
          npm --prefix frontend test
      - name: Type-check mobile
        run: |
          npm --prefix mobile ci
          npm --prefix mobile run typecheck

      - name: Build and smoke-test the Host image
        run: |
          make image
          ./scripts/smoke-image.sh
      - name: Smoke-test the web chat on Docker
        if: github.event_name != 'workflow_dispatch'
        run: RUN_DOCKER_INTEGRATION=1 go test -tags webui ./tests/integration -run '^TestDockerWebChatPreview$' -v
      - name: Run the full Docker integration suite
        if: github.event_name == 'workflow_dispatch'
        run: RUN_DOCKER_INTEGRATION=1 go test -tags webui ./tests/integration -v
      - name: Smoke-test Controller, Redis and Hosts with Docker Compose
        run: python3 scripts/smoke-cli.py
