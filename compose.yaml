name: go-bot

services:
  controller:
    build:
      context: .
      dockerfile: build/Dockerfile.controller
    image: go-bot/controller:local
    # No --env-file/--config: the controller image bakes in /app/.env
    # (from .env.example) and tuning defaults match configs/default.yaml.
    # Bind-mounting repo files breaks on Coolify, whose app dir has no clone.
    command: ["serve"]
    environment:
      REDIS_ADDR: redis:6379
      CONTROLLER_CONTAINER: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Campus-pc/Coolify: host 8080 is already taken by another app;
      # Traefik routes gobot.arifin.uk to container port 8080 internally.
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ingress
      - state
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    # No host port: campus-pc already runs a host Redis on 127.0.0.1:6379.
    # Controller reaches this Redis over the compose network (redis:6379).
    volumes:
      - controller-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - state
      - redis-access

networks:
  ingress:
  state:
    internal: true
  # Docker needs a non-internal network to publish the Redis port on the host.
  redis-access:
volumes:
  controller-data:
