name: go-bot

services:
  controller:
    build:
      context: .
      dockerfile: build/Dockerfile.controller
    image: go-bot/controller:local
    command: ["serve", "--env-file", "/config/deployment.env", "--config", "/config/runtime.yaml"]
    environment:
      REDIS_ADDR: redis:6379
      CONTROLLER_CONTAINER: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${GO_BOT_ENV_FILE:-./.env}
        target: /config/deployment.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GO_BOT_CONFIG_FILE:-./configs/default.yaml}
        target: /config/runtime.yaml
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Campus-pc/Coolify: host 8080 is already taken by another app;
      # Traefik routes gobot.arifin.uk to container port 8080 internally.
      - "18080:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ingress
      - state
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    # No host port: campus-pc already runs a host Redis on 127.0.0.1:6379.
    # Controller reaches this Redis over the compose network (redis:6379).
    volumes:
      - controller-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - state
      - redis-access

networks:
  ingress:
  state:
    internal: true
  # Docker needs a non-internal network to publish the Redis port on the host.
  redis-access:
volumes:
  controller-data:
